# Builds and publishes PHARM to Firebase Hosting.
#
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT, holding the JSON key
# of a service account with the "Firebase Hosting Admin" role. Create it under
# Google Cloud console → IAM → Service accounts, in the my-hospital-2026
# project, then paste the whole JSON file into
# Settings → Secrets and variables → Actions.
#
# The published build uses the in-memory dataset: a hosted page cannot reach
# anything on a student's localhost. Point it at a real backend per visitor
# with a query string instead:
#
#   https://my-hospital-pharm.procaryote.com/?backend=restApi&api=https://your-api
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      # "auto" is the default and means: decide from the repository variables,
      # exactly as a push does. A choice input cannot default to empty, and a
      # default of "demo" silently overrode the detection below - a manual
      # re-run then shipped demo sign-in however the variables were set.
      backend:
        description: "Backend compiled in (auto = restApi when API_BASE is set)"
        default: auto
        type: choice
        options: [auto, memory, restApi, dataConnect]
      auth:
        description: "Sign-in compiled in (auto = firebase when configured)"
        default: auto
        type: choice
        options: [auto, demo, firebase]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Without a service account there is nothing to deploy with, and a red
    # cross on every fork would be noise rather than information.
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'LucaProcaryote'
    steps:
      - uses: actions/checkout@v4

      - name: Check that a deploy credential is configured
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::No FIREBASE_SERVICE_ACCOUNT secret is set, so there is nothing to deploy with."
            echo "::error::Create a service account with the Firebase Hosting Admin role in the"
            echo "::error::my-hospital-2026 project, then paste its whole JSON key into"
            echo "::error::Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "::error::The hosting sites must exist first: Dev_Central/tools/create_hosting_sites.sh"
            exit 1
          fi

      # Deploying needs the site to exist, and creating a site is a separate,
      # one-time operation. Doing it here means nobody has to remember to run
      # tools/create_hosting_sites.sh before the first deploy. Creating a site
      # that is already there is a no-op, so this is safe on every run.
      - name: Make sure the hosting site exists
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: my-hospital-2026
          SITE: my-hospital-2026-pharm
        run: |
          creds="$RUNNER_TEMP/firebase-key.json"
          printf '%s' "$KEY" > "$creds"
          export GOOGLE_APPLICATION_CREDENTIALS="$creds"
          trap 'rm -f "$creds"' EXIT

          if npx -y firebase-tools hosting:sites:list --project "$PROJECT" | grep -q -- "$SITE"; then
            echo "$SITE already exists"
          elif npx -y firebase-tools hosting:sites:create "$SITE" --project "$PROJECT"; then
            echo "created $SITE"
          else
            echo "::error::Could not create the hosting site $SITE in $PROJECT."
            echo "::error::Site ids are globally unique across all of Firebase, so this one may"
            echo "::error::be taken by someone else - pick another and change it here and in .firebaserc."
            echo "::error::The other possibility is that the service account lacks roles/firebasehosting.admin."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build for the web
        env:
          # Set this repository variable once the Cloud Run API is deployed
          # (Settings -> Secrets and variables -> Actions -> Variables) and the
          # hosted build talks to the real PostgreSQL. Without it every visitor
          # gets their own in-browser hospital, which is the right default for
          # a page that cannot reach anything on a student's localhost.
          API_BASE: ${{ vars.API_BASE }}

          # Set these three and the build signs in against Firebase instead of
          # the demo accounts. None is a secret: a web API key identifies the
          # project, it does not authorise anything. The app id differs per
          # application; the sender id is the project number, shared.
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          backend="${{ inputs.backend }}"
          auth="${{ inputs.auth }}"
          # A push sends neither; a manual run sends "auto" unless overridden.
          [ "$backend" = "auto" ] && backend=""
          [ "$auth" = "auto" ] && auth=""

          if [ -z "$backend" ]; then
            if [ -n "$API_BASE" ]; then backend=restApi; else backend=memory; fi
          fi

          # All three or none. A half-configured project would compile happily
          # and then fail at the sign-in screen, which is the worst place to
          # discover a missing variable.
          if [ -z "$auth" ]; then
            if [ -n "$FIREBASE_API_KEY" ] && [ -n "$FIREBASE_APP_ID" ] \
               && [ -n "$FIREBASE_MESSAGING_SENDER_ID" ]; then
              auth=firebase
            else
              auth=demo
              if [ -n "$FIREBASE_API_KEY$FIREBASE_APP_ID$FIREBASE_MESSAGING_SENDER_ID" ]; then
                echo "::warning::Some FIREBASE_* variables are set but not all three;"
                echo "::warning::building with demo sign-in. Needed: FIREBASE_API_KEY,"
                echo "::warning::FIREBASE_APP_ID, FIREBASE_MESSAGING_SENDER_ID."
              fi
            fi
          fi

          # Self-host CanvasKit: see tools/deploy_hosting.sh for why.
          defines=(
            --dart-define=BACKEND="$backend"
            --dart-define=AUTH="$auth"
          )
          [ -n "$API_BASE" ] && defines+=(--dart-define=API_BASE="$API_BASE")
          for name in FIREBASE_API_KEY FIREBASE_APP_ID \
                      FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID; do
            value="${!name}"
            [ -n "$value" ] && defines+=(--dart-define="$name=$value")
          done

          echo "backend: $backend, auth: $auth"
          flutter build web --release --no-web-resources-cdn "${defines[@]}"

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: my-hospital-2026
          target: pharm
          channelId: live
