# Analyse and test on every push.
#
# The vendored hospital_core is part of this repository, so a broken sync shows
# up here rather than in a lab session.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        run: flutter analyze

      - name: Test
        run: flutter test
