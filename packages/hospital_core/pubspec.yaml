name: hospital_core
description: >-
  Shared domain model, FHIR R4 mapping, trilingual (EN/FR/NL) localisation,
  authentication, data-access layer and design system for the Mini-Hospital 2026
  teaching platform (EHR, ADT, PHARM, EAI, device simulators).
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.9.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  provider: ^6.1.0
  go_router: ^14.0.0
  uuid: ^4.4.0
  shared_preferences: ^2.3.0
  collection: ^1.18.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  # MQTT over WebSocket, because a browser cannot open a TCP socket and the
  # device simulators have to reach the same broker the web applications do.
  mqtt_client: ^10.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
